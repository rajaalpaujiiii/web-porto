<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Raja Alpauji</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --sky-blue: #a0c4ff; --neon-yellow: #e2fd52; --deep-blue: #4361ee; --paper-white: #ffffff; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--sky-blue); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .main-canvas { background-color: var(--paper-white); max-width: 900px; padding: 50px; border-radius: 5px; box-shadow: 10px 10px 0px rgba(0,0,0,0.1); position: relative; border: 1px dashed #ccc; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px; }
        .hero-text h1 { font-family: 'Montserrat', sans-serif; font-size: 80px; margin: 0; color: var(--deep-blue); -webkit-text-stroke: 1px var(--neon-yellow); line-height: 0.9; }
        .name-tag { font-size: 24px; margin-top: 10px; background: var(--neon-yellow); display: inline-block; padding: 5px 15px; font-weight: bold; color: black; }
        .photo-frame { background: white; padding: 10px 10px 40px 10px; box-shadow: 5px 5px 15px rgba(0,0,0,0.2); transform: rotate(5deg); border: 1px solid #ddd; text-align: center; }
        .photo-frame img { width: 200px; height: 250px; object-fit: cover; display: block; background-color: #eee; }
        .about-section { max-width: 600px; margin-bottom: 40px; line-height: 1.6; }
        .tools-container { background-color: var(--deep-blue); padding: 30px; margin: 0 -50px -50px -50px; border-radius: 0 0 5px 5px; }
        .software-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; }
        .software-card { background: white; padding: 15px; border-radius: 8px; text-align: center; border-bottom: 5px solid var(--neon-yellow); }
        .software-card img { width: 40px; height: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="main-canvas">
    <header>
        <div class="hero-text"><h1>Hello!</h1><div class="name-tag">I'm Raja Alpauji</div>
            <p><b>IG</b> @rrajaalf | <b>Email</b> rrajaalpauii@gmail.com</p>
        </div>
        <div class="photo-frame">
            <img src="https://storage.googleapis.com/image_generation_content/0/f3297b215b808e359b7d166d0fe8fe13.jpg" alt="Raja Alpauji">
            <p style="font-family: cursive; margin-top: 10px;">Ja 2026</p>
        </div>
    </header>
    <section class="about-section">
        <h3 style="background: var(--neon-yellow); display:inline; padding: 2px 8px;">ABOUT ME</h3>
        <p>Halo! Gue seorang Graphic Designer sekaligus Video Maker. Gue siap nge-transformasi ide-ide liar lo jadi karya visual yang solid.</p>
    </section>
    <div class="tools-container">
        <div class="software-grid">
            <div class="software-card"><img src="https://img.icons8.com/color/96/adobe-photoshop.png"><div>Photoshop</div></div>
            <div class="software-card"><img src="https://img.icons8.com/color/96/adobe-illustrator.png"><div>Affinity</div></div>
            <div class="software-card"><img src="https://img.icons8.com/ios-filled/100/video-editing.png"><div>CapCut</div></div>
            <div class="software-card"><img src="https://img.icons8.com/color/96/figma.png"><div>Figma</div></div>
        </div>
    </div>
</div>
</body>
</html>
